<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Notifications | Daily Student Digital Communication System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: #12355b;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 800px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 16px;
      font-weight: bold;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      color: #12355b;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .form-message {
      display: none;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-message.success {
      display: block;
      background: #e6f7ec;
      color: #1e7e34;
      border: 1px solid #b7e4c7;
    }

    .form-message.error {
      display: block;
      background: #fdecea;
      color: #c0392b;
      border: 1px solid #f5c6cb;
    }

    .form-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .form-card h2 {
      color: #12355b;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #1d5d8f;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      background: #12355b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .submit-btn:disabled {
      background: #9aa8b5;
      cursor: not-allowed;
    }

    .section-title {
      color: #12355b;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .notif-card {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .notif-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .notif-title {
      color: #12355b;
      font-weight: bold;
      font-size: 16px;
    }

    .notif-meta {
      font-size: 12px;
      color: #777;
      margin-bottom: 10px;
    }

    .audience-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      background: #eef6fb;
      color: #12355b;
    }

    .notif-message {
      font-size: 14px;
      color: #333;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .delete-btn {
      background: none;
      border: 1px solid #c0392b;
      color: #c0392b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12355b;
      font-weight: bold;
    }

    .empty-state {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <div id="loadingScreen" class="loading-screen">
    Loading...
  </div>

  <div id="pageContent" style="display:none;">

    <header>
      <div class="header-content">
        <div class="logo">DAILY STUDENT DIGITAL COMMUNICATION SYSTEM</div>
        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
      </div>
    </header>

    <main class="container">

      <h1>Manage Notifications</h1>
      <p class="subtitle">Post an announcement to students, parents, or everyone.</p>

      <div id="formMessage" class="form-message"></div>

      <div class="form-card">
        <h2>New Notification</h2>

        <form id="notifForm" novalidate>

          <div class="form-group">
            <label>Title</label>
            <input type="text" id="notifTitle" placeholder="e.g. Mid-Term Break Notice" required>
          </div>

          <div class="form-group">
            <label>Message</label>
            <textarea id="notifMessage" placeholder="Write the announcement here" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Send To</label>
              <select id="notifAudience">
                <option value="All">Everyone</option>
                <option value="Students">Students Only</option>
                <option value="Parents">Parents Only</option>
              </select>
            </div>

            <div class="form-group">
              <label>Class (Optional)</label>
              <select id="notifClass">
                <option value="">All Classes</option>
                <option>JSS 1</option>
                <option>JSS 2</option>
                <option>JSS 3</option>
                <option>SS 1</option>
                <option>SS 2</option>
                <option>SS 3</option>
              </select>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            POST NOTIFICATION
          </button>

        </form>
      </div>

      <h2 class="section-title">Posted Notifications</h2>

      <div id="notifList"></div>

    </main>

  </div>

  <!-- Supabase JS SDK (must load before supabase-config.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const loadingScreen = document.getElementById("loadingScreen");
    const pageContent = document.getElementById("pageContent");
    const form = document.getElementById("notifForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");
    const notifList = document.getElementById("notifList");

    function showFormMessage(type, text) {
      formMessage.className = "form-message " + type;
      formMessage.textContent = text;
      setTimeout(() => { formMessage.className = "form-message"; }, 3500);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    async function loadNotifications() {
      const { data: notifs } = await supabaseClient
        .from("notifications")
        .select("id, title, message, audience, class, created_at")
        .order("created_at", { ascending: false });

      if (!notifs || notifs.length === 0) {
        notifList.innerHTML = '<div class="empty-state">No notifications posted yet.</div>';
        return;
      }

      notifList.innerHTML = "";

      notifs.forEach(function (n) {
        const audienceLabel = n.audience === "All" ? "Everyone" : n.audience;
        const classLabel = n.class ? " · " + n.class : " · All Classes";

        const card = document.createElement("div");
        card.className = "notif-card";

        card.innerHTML = `
          <div class="notif-top">
            <div class="notif-title">${n.title}</div>
            <button class="delete-btn" data-id="${n.id}">DELETE</button>
          </div>
          <div class="notif-meta">
            <span class="audience-badge">${audienceLabel}${classLabel}</span>
            &nbsp; ${formatDate(n.created_at)}
          </div>
          <div class="notif-message">${n.message}</div>
        `;

        notifList.appendChild(card);
      });

      document.querySelectorAll(".delete-btn").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          if (!confirm("Delete this notification?")) return;

          const id = btn.getAttribute("data-id");
          const { error } = await supabaseClient.from("notifications").delete().eq("id", id);

          if (error) {
            showFormMessage("error", "Failed to delete: " + error.message);
          } else {
            showFormMessage("success", "Notification deleted.");
            loadNotifications();
          }
        });
      });
    }

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const session = sessionData.session;

      if (!session) {
        window.location.href = "admin-login.html";
        return;
      }

      const { data: adminRow, error: adminError } = await supabaseClient
        .from("admins")
        .select("id")
        .eq("user_id", session.user.id)
        .single();

      if (adminError || !adminRow) {
        await supabaseClient.auth.signOut();
        window.location.href = "admin-login.html";
        return;
      }

      await loadNotifications();

      loadingScreen.style.display = "none";
      pageContent.style.display = "block";
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const title = document.getElementById("notifTitle").value.trim();
      const message = document.getElementById("notifMessage").value.trim();
      const audience = document.getElementById("notifAudience").value;
      const classVal = document.getElementById("notifClass").value;

      if (!title || !message) {
        showFormMessage("error", "Please fill in the title and message.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "POSTING...";

      const { error } = await supabaseClient
        .from("notifications")
        .insert([{
          title: title,
          message: message,
          audience: audience,
          class: classVal || null
        }]);

      submitBtn.disabled = false;
      submitBtn.textContent = "POST NOTIFICATION";

      if (error) {
        showFormMessage("error", "Failed to post: " + error.message);
        return;
      }

      showFormMessage("success", "Notification posted!");
      form.reset();
      loadNotifications();
    });

    init();
  </script>

</body>
</html>
