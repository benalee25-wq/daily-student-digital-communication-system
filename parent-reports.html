<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Reports | Daily Student Digital Communication System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: #12355b;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 800px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 16px;
      font-weight: bold;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      color: #12355b;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 22px;
    }

    .report-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .report-date {
      color: #12355b;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .rating-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
      background: #eef6fb;
      color: #12355b;
    }

    .sub-section {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #eee;
    }

    .sub-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .sub-section-title {
      font-size: 13px;
      font-weight: bold;
      color: #12355b;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .sub-section p {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
    }

    .flag-red p {
      color: #c0392b;
    }

    .flag-orange p {
      color: #b8860b;
    }

    .entry-item {
      background: #f4f7fb;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .entry-item:last-child {
      margin-bottom: 0;
    }

    .entry-item strong {
      color: #12355b;
    }

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12355b;
      font-weight: bold;
    }

    .empty-state {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #777;
    }

    .no-link-notice {
      background: #fff3cd;
      color: #856404;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="loadingScreen" class="loading-screen">
    Loading reports...
  </div>

  <div id="pageContent" style="display:none;">

    <header>
      <div class="header-content">
        <div class="logo">DAILY STUDENT CONNECT</div>
        <a href="parent-dashboard.html" class="back-link">← Back to Dashboard</a>
      </div>
    </header>

    <main class="container">

      <h1>Daily Reports</h1>
      <p class="subtitle">Reports submitted for your child.</p>

      <div id="reportsList"></div>

    </main>

  </div>

  <!-- Supabase JS SDK (must load before supabase-config.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const loadingScreen = document.getElementById("loadingScreen");
    const pageContent = document.getElementById("pageContent");
    const reportsList = document.getElementById("reportsList");

    function formatDate(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }

    function section(title, value, flagClass) {
      if (!value) return "";
      return `
        <div class="sub-section ${flagClass || ''}">
          <div class="sub-section-title">${title}</div>
          <p>${value}</p>
        </div>
      `;
    }

    function renderReport(report) {
      const card = document.createElement("div");
      card.className = "report-card";

      let html = `<div class="report-date">${formatDate(report.report_date)}</div>`;

      if (report.daily_rating) {
        html += `<div class="rating-badge">School today: ${report.daily_rating}</div>`;
      }

      html += section("Comment on the day", report.daily_rating_comment);
      html += section("What they learned", report.what_learned);

      if (report.had_unusual_event) {
        html += section("⚠️ Unusual event", report.unusual_incident, "flag-red");
      }

      if (report.was_punished) {
        html += section("🚨 Reason for punishment", report.punishment_reason, "flag-red");
        html += section("🚨 Punishment given", report.punishment_given, "flag-red");
      }

      if (report.had_assignments && report.report_assignments && report.report_assignments.length > 0) {
        let entries = report.report_assignments.map(function (a) {
          return `<div class="entry-item"><strong>${a.subject || 'Assignment'}</strong> (${a.teacher || 'no teacher listed'})<br>${a.instruction || ''}${a.submission_date ? '<br>Due: ' + a.submission_date : ''}</div>`;
        }).join("");
        html += `<div class="sub-section"><div class="sub-section-title">Assignments</div>${entries}</div>`;
      }

      if (report.had_topics_not_understood && report.report_topics && report.report_topics.length > 0) {
        let entries = report.report_topics.map(function (t) {
          return `<div class="entry-item"><strong>${t.subject || ''}</strong> - ${t.topic || ''} (${t.teacher || 'no teacher listed'})</div>`;
        }).join("");
        html += `<div class="sub-section flag-orange"><div class="sub-section-title">💡 Topics not understood</div>${entries}</div>`;
        html += section("Why they didn't understand", report.not_understood_reason);
        if (report.asked_teacher === false) {
          html += section("Did not ask the teacher — why", report.why_not_asked);
        }
      }

      if (report.had_classwork && report.report_classwork && report.report_classwork.length > 0) {
        let entries = report.report_classwork.map(function (c) {
          return `<div class="entry-item"><strong>${c.subject || ''}</strong> (${c.teacher || 'no teacher listed'}) — Score: ${c.score || 'N/A'}</div>`;
        }).join("");
        html += `<div class="sub-section"><div class="sub-section-title">Classwork</div>${entries}</div>`;
      }

      if (report.corrections_status) {
        html += section("Corrections completed?", report.corrections_status);
        if (report.corrections_status === "No") {
          html += section("Why corrections weren't done", report.corrections_reason);
        }
      }

      html += section("Additional comments", report.additional_comments);

      card.innerHTML = html;
      return card;
    }

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const session = sessionData.session;

      if (!session) {
        window.location.href = "parent-login.html";
        return;
      }

      const { data: parent, error: parentError } = await supabaseClient
        .from("parents")
        .select("linked_student_id")
        .eq("user_id", session.user.id)
        .single();

      if (parentError || !parent) {
        await supabaseClient.auth.signOut();
        window.location.href = "parent-login.html";
        return;
      }

      if (!parent.linked_student_id) {
        reportsList.innerHTML = `
          <div class="no-link-notice">
            ⚠️ Your account hasn't been connected to your child's official student
            record yet, so reports can't be shown here. The school administrator
            will complete this shortly.
          </div>
        `;
        loadingScreen.style.display = "none";
        pageContent.style.display = "block";
        return;
      }

      const { data: reports, error: reportsError } = await supabaseClient
        .from("reports")
        .select("*, report_assignments(*), report_topics(*), report_classwork(*)")
        .eq("student_id", parent.linked_student_id)
        .order("report_date", { ascending: false });

      if (reportsError || !reports || reports.length === 0) {
        reportsList.innerHTML = '<div class="empty-state">No reports submitted yet.</div>';
      } else {
        reportsList.innerHTML = "";
        reports.forEach(function (report) {
          reportsList.appendChild(renderReport(report));
        });
      }

      loadingScreen.style.display = "none";
      pageContent.style.display = "block";
    }

    init();
  </script>

</body>
</html>
