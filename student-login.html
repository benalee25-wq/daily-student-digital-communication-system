<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Login | Daily Student Digital Communication System</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #12355b, #1d5d8f);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 15px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #12355b;
      font-size: 24px;
    }

    .logo p {
      color: #777;
      margin-top: 8px;
      font-size: 14px;
    }

    .student-icon {
      width: 70px;
      height: 70px;
      background: #e8f4fb;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 35px;
    }

    h2 {
      text-align: center;
      color: #12355b;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #444;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1d5d8f;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #12355b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #1d5d8f;
    }

    .forgot {
      text-align: right;
      margin-top: 10px;
    }

    .forgot a {
      color: #1d5d8f;
      text-decoration: none;
      font-size: 14px;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #555;
    }

    .register a {
      color: #12355b;
      font-weight: bold;
      text-decoration: none;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #777;
      text-decoration: none;
      font-size: 14px;
    }

  </style>

</head>

<body>

  <div class="login-container">

    <div class="logo">

      <div class="student-icon">
        🎓
      </div>

      <h1>DAILY STUDENT CONNECT</h1>

      <p>Connecting Students, Parents and Schools Every Day.</p>

    </div>

    <h2>Student Login</h2>

    <form>

      <div class="form-group">

        <label>Student Email Address</label>

        <input
          type="email"
          placeholder="Enter your email address"
          required
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <button type="submit" class="login-btn">
        LOGIN
      </button>

    </form>


    <div class="forgot">

      <a href="#">
        Forgot Password?
      </a>

    </div>


    <div class="register">

      Don't have a student account?

      <br><br>

      <a href="student-register.html">
        Register Here
      </a>

    </div>


    <div class="back-home">

      <a href="index.html">
        ← Back to Homepage
      </a>

    </div>

  </div>

</body>
</html>
