<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>All Daily Reports | Daily Student Digital Communication System</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: #12355b;
      color: white;
      padding: 18px 20px;
    }

    .header-content {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 16px;
      font-weight: bold;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      color: #12355b;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .search-box {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 20px;
      background: white;
    }

    .report-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    .report-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .student-name {
      color: #12355b;
      font-weight: bold;
      font-size: 16px;
    }

    .student-class {
      color: #777;
      font-size: 13px;
    }

    .report-date {
      color: #777;
      font-size: 13px;
    }

    .report-field {
      margin-bottom: 12px;
    }

    .report-field label {
      display: block;
      font-size: 12px;
      color: #888;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .report-field p {
      font-size: 14px;
      color: #333;
      line-height: 1.5;
    }

    .report-field.incident p {
      color: #c0392b;
    }

    .loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #12355b;
      font-weight: bold;
    }

    .empty-state {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>

  <div id="loadingScreen" class="loading-screen">
    Loading reports...
  </div>

  <div id="pageContent" style="display:none;">

    <header>
      <div class="header-content">
        <div class="logo">DAILY STUDENT DIGITAL COMMUNICATION SYSTEM</div>
        <a href="admin-dashboard.html" class="back-link">← Back to Dashboard</a>
      </div>
    </header>

    <main class="container">

      <h1>All Daily Reports</h1>
      <p class="subtitle">Every report submitted by every student, most recent first.</p>

      <input type="text" id="searchBox" class="search-box" placeholder="Search by student name...">

      <div id="reportsList"></div>

    </main>

  </div>

  <!-- Supabase JS SDK (must load before supabase-config.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const loadingScreen = document.getElementById("loadingScreen");
    const pageContent = document.getElementById("pageContent");
    const reportsList = document.getElementById("reportsList");
    const searchBox = document.getElementById("searchBox");

    let allReports = [];

    function formatDate(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
    }

    function fieldRow(label, value, isIncident) {
      if (!value) return "";
      return `
        <div class="report-field ${isIncident ? 'incident' : ''}">
          <label>${label}</label>
          <p>${value}</p>
        </div>
      `;
    }

    function renderReports(reports) {
      if (reports.length === 0) {
        reportsList.innerHTML = '<div class="empty-state">No reports found.</div>';
        return;
      }

      reportsList.innerHTML = "";

      reports.forEach(function (report) {
        const student = report.students || {};
        const card = document.createElement("div");
        card.className = "report-card";

        card.innerHTML = `
          <div class="report-top">
            <div>
              <div class="student-name">${student.full_name || "Unknown Student"}</div>
              <div class="student-class">${student.class || ""}</div>
            </div>
            <div class="report-date">${formatDate(report.report_date)}</div>
          </div>
          ${fieldRow("Subjects Covered", report.subjects_covered)}
          ${fieldRow("Homework Given", report.homework_given)}
          ${fieldRow("Classwork Summary", report.classwork_summary)}
          ${fieldRow("Behaviour Notes", report.behavior_notes)}
          ${fieldRow("Unusual Incident", report.unusual_incident, true)}
        `;

        reportsList.appendChild(card);
      });
    }

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const session = sessionData.session;

      if (!session) {
        window.location.href = "admin-login.html";
        return;
      }

      const { data: adminRow, error: adminError } = await supabaseClient
        .from("admins")
        .select("id")
        .eq("user_id", session.user.id)
        .single();

      if (adminError || !adminRow) {
        await supabaseClient.auth.signOut();
        window.location.href = "admin-login.html";
        return;
      }

      // Fetch all reports, joined with the student's name and class
      const { data: reports, error: reportsError } = await supabaseClient
        .from("reports")
        .select("report_date, subjects_covered, homework_given, classwork_summary, behavior_notes, unusual_incident, students(full_name, class)")
        .order("report_date", { ascending: false });

      allReports = reports || [];
      renderReports(allReports);

      loadingScreen.style.display = "none";
      pageContent.style.display = "block";
    }

    searchBox.addEventListener("input", function () {
      const query = searchBox.value.trim().toLowerCase();

      if (!query) {
        renderReports(allReports);
        return;
      }

      const filtered = allReports.filter(function (report) {
        const name = (report.students && report.students.full_name || "").toLowerCase();
        return name.includes(query);
      });

      renderReports(filtered);
    });

    init();
  </script>

</body>
</html>
